set_installer_setting:
  fields:
    setting:
      required: true
      example: Feed-in Limit
      selector:
        select:
          custom_value: true
          options:
            - Feed-in Limit
            - Main Breaker Current Limit
            - Battery Charge Max Current
            - Battery Discharge Max Current
            - EPS Min SoC
            - Meter 1 Direction
            - Meter 2 Direction
            - Grid Bias Direction
            - Shadow Fix Level PV1 (GMPPT)
            - Shadow Fix Level PV2 (GMPPT)
            - Shadow Fix Level PV3 (GMPPT)
    value:
      required: true
      example: 4500
      selector:
        text:
    confirm:
      required: true
      default: false
      selector:
        boolean:
    host:
      example: 192.168.1.100
      selector:
        text:

get_installer_settings:
  fields:
    host:
      example: 192.168.1.100
      selector:
        text:

unlock:
  fields:
    host:
      example: 192.168.1.100
      selector:
        text:
